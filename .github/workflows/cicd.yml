# .github/workflows/cicd.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  docker-build-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:${{ github.sha }}

  deploy:
    name: Deploy (pull image and run with MySQL)
    needs: docker-build-push
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/notes-api:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Pull the published image and start the stack
        run: docker compose up -d --pull always --no-build
      - name: Smoke test the running backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 3
          done
          curl -s -X POST http://localhost:5000/notes \
            -H "Content-Type: application/json" \
            -d '{"title":"hello","content":"deployed by CI/CD"}'
          echo
          curl -s http://localhost:5000/notes
          echo
